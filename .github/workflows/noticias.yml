name: Bot de noticias

on:
  schedule:
    # Cada 3 horas (hora UTC). Ajusta a tu gusto: https://crontab.guru
    - cron: "0 */3 * * *"
  workflow_dispatch: # permite ejecutarlo a mano desde GitHub

permissions:
  contents: write

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Guarda qué noticias ya se enviaron para no repetirlas
      - name: Guardar vistos
        run: |
          git config user.name "bot-noticias"
          git config user.email "bot@users.noreply.github.com"
          git add vistos.json
          git diff --cached --quiet || git commit -m "Actualizar noticias vistas"
          git push
